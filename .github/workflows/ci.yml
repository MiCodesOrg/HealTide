name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Lua syntax check
        run: luac5.1 -p HealTide.lua

      - name: Offline tests
        run: lua5.1 tests/test_healtide.lua
